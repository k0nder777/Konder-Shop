<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <!-- Блокируем масштабирование для мобилок, чтобы выглядело как нативное приложение -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Konder Shop</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #070814;
      --card-bg: rgba(20, 24, 48, 0.75);
      --card-border: rgba(139, 92, 246, 0.25);
      --accent-purple: #8B5CF6;
      --accent-glow: #A78BFA;
      --accent-cyan: #06B6D4;
      --accent-green: #10B981;
      --accent-red: #EF4444;
      --text-main: #FFFFFF;
      --text-muted: #94A3B8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    
    body {
      background: radial-gradient(circle at 50% 0%, #171133 0%, var(--bg) 75%);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      /* Фикс для мобильных браузеров, чтобы контент не перекрывался нижней панелью */
      min-height: 100vh;
      min-height: -webkit-fill-available;
      padding-bottom: 120px; 
    }

    header {
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(11, 12, 26, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(139, 92, 246, 0.2);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      font-family: 'Orbitron', sans-serif;
      font-size: 19px;
      font-weight: 800;
      background: linear-gradient(135deg, #FFF, var(--accent-glow));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .role-badge {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid var(--accent-green);
      color: var(--accent-green);
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 8px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .role-badge.admin {
      background: rgba(239, 68, 68, 0.2);
      border-color: var(--accent-red);
      color: var(--accent-red);
    }

    .container { padding: 16px; }
    .page { display: none; }
    .page.active { display: block; }

    .section-title {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--accent-cyan);
      margin: 18px 0 10px 4px;
    }

    .grid { display: flex; flex-direction: column; gap: 14px; }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px;
      backdrop-filter: blur(10px);
      position: relative;
      overflow: hidden;
    }

    .discount-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      background: var(--accent-red);
      color: #FFF;
      font-size: 11px;
      font-weight: 800;
      padding: 3px 7px;
      border-radius: 6px;
      box-shadow: 0 0 10px rgba(239, 68, 68, 0.5);
    }

    .card h3 { font-size: 17px; margin-bottom: 6px; }
    .card p { font-size: 13px; color: var(--text-muted); line-height: 1.4; margin-bottom: 14px; }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .price {
      font-size: 17px;
      font-weight: 800;
      color: var(--accent-glow);
      font-family: 'Orbitron', sans-serif;
    }

    .btn {
      background: linear-gradient(135deg, var(--accent-purple), #6D28D9);
      color: #FFF;
      border: none;
      padding: 10px 18px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn:active { transform: scale(0.97); }
    .btn-danger { background: linear-gradient(135deg, var(--accent-red), #991B1B); }
    .btn-block { width: 100%; justify-content: center; padding: 12px; }

    .warning-box {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid var(--accent-red);
      border-radius: 10px;
      padding: 10px;
      font-size: 11px;
      line-height: 1.4;
      color: #FCA5A5;
      margin: 12px 0;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(5px);
      display: none;
      z-index: 2000;
      align-items: flex-end;
    }
    .modal-overlay.active { display: flex; }
    .modal {
      background: #0F1328;
      border-top: 1px solid var(--accent-purple);
      border-radius: 24px 24px 0 0;
      padding: 20px;
      width: 100%;
      max-height: 88vh;
      overflow-y: auto;
    }

    .option-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      font-size: 13px;
    }

    .requisites-box {
      background: rgba(139, 92, 246, 0.1);
      border: 1px dashed var(--accent-purple);
      border-radius: 12px;
      padding: 12px;
      margin: 14px 0 8px;
      font-size: 13px;
    }

    .input-field {
      width: 100%;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 10px;
      padding: 11px;
      color: #FFF;
      margin-bottom: 8px;
      font-size: 13px;
    }

    /* Жёсткая фиксация панели в самом низу поверх всего */
    .tabbar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(11, 12, 26, 0.98);
      backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: space-around;
      /* env() защищает от перекрытия полоской на iPhone и кнопками Android */
      padding: 12px 0 calc(16px + env(safe-area-inset-bottom));
      z-index: 9999;
    }

    .tab-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      font-weight: 500;
      position: relative;
      cursor: pointer;
    }
    .tab-btn.active { color: var(--accent-glow); }
    .badge-counter {
      position: absolute;
      top: -4px;
      right: 0px;
      background: var(--accent-red);
      color: #FFF;
      font-size: 9px;
      padding: 2px 5px;
      border-radius: 10px;
      font-weight: 700;
    }

    .stars { display: flex; gap: 8px; margin: 10px 0; }
    .star { font-size: 24px; color: #4B5563; cursor: pointer; }
    .star.selected { color: #F59E0B; }

    .admin-input-group {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255,255,255,0.03);
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 8px;
    }
    .admin-input-group input {
      width: 90px;
      background: #000;
      border: 1px solid var(--accent-purple);
      color: #FFF;
      padding: 6px;
      border-radius: 6px;
      text-align: right;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">KONDER SHOP 💰</div>
    <div class="role-badge" id="roleTag">ONLINE</div>
  </header>

  <div class="container">
    <!-- СТРАНИЦА 1: КАТАЛОГ -->
    <div id="page-catalog" class="page active">
      <div class="section-title">Индивидуальная разработка</div>
      <div class="grid" id="custom-services-list"></div>

      <div class="section-title">Готовые шаблоны</div>
      <div class="grid" id="templates-list"></div>
    </div>

    <!-- СТРАНИЦА 2: ОТЗЫВЫ -->
    <div id="page-reviews" class="page">
      <div class="section-title">Отзывы клиентов</div>
      <div id="reviews-list" class="grid"></div>
      
      <div style="margin-top: 20px;">
        <div class="card">
          <h3>Оставить отзыв</h3>
          <p id="review-lock-msg" style="color: #F87171;
